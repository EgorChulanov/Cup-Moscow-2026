<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const P = new URLSearchParams(location.search);
const obj = P.get('obj') || 'bubble';
const S = +(P.get('s') || 1200);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(S, S);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;

const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
cam.position.set(0, 0.4, 9);
cam.lookAt(0, 0, 0);

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 6, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xfff3c4, 0.9); rim.position.set(-6, 2, -3); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const yellow = new THREE.MeshPhysicalMaterial({ color: new THREE.Color("#ffd51c"), roughness: 0.28, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.08, sheen: 0.3, sheenColor: 0xfff1a8 });
const ink = new THREE.MeshPhysicalMaterial({ color: 0x2b2d33, roughness: 0.35, metalness: 0.1, clearcoat: 0.8, clearcoatRoughness: 0.15 });
const white = new THREE.MeshPhysicalMaterial({ color: 0xf7f7f5, roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.1 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.32, transmission: 1, thickness: 0.6, ior: 1.4, clearcoat: 1, clearcoatRoughness: 0.05, attenuationColor: 0xfff6d6, attenuationDistance: 3 });

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
const ext = (shape, depth, bevel) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 10, curveSegments: 48 });
function center(g) { g.computeBoundingBox(); const c = new THREE.Vector3(); g.boundingBox.getCenter(c); g.translate(-c.x, -c.y, -c.z); return g; }

function checkShape(w) {
  // толстая галочка как контур
  const t = w * 0.17, s = new THREE.Shape();
  s.moveTo(-w * 0.5, 0.02 * w); s.lineTo(-w * 0.5 + t, 0.02 * w + t);
  s.lineTo(-w * 0.12, -0.3 * w + t * 1.1); s.lineTo(w * 0.5 - t * 0.2, 0.42 * w);
  s.lineTo(w * 0.5, 0.42 * w - t * 0.9 + 0.02); s.lineTo(-w * 0.12, -0.36 * w - t * 0.05);
  s.closePath();
  return s;
}

function bubble() {
  const g = new THREE.Group();
  const body = roundedRect(3.4, 2.5, 0.95);
  const geo = center(ext(body, 0.7, 0.28));
  const m = new THREE.Mesh(geo, yellow); g.add(m);
  // хвостик
  const tail = new THREE.Shape(); tail.moveTo(-0.2, 0); tail.lineTo(0.75, 0); tail.quadraticCurveTo(0.2, -0.55, -0.55, -0.85); tail.quadraticCurveTo(-0.1, -0.4, -0.2, 0);
  const tg = ext(tail, 0.7, 0.2); tg.translate(-1.0, -1.05, -0.35);
  g.add(new THREE.Mesh(tg, yellow));
  const ck = center(ext(checkShape(1.5), 0.25, 0.08));
  const c = new THREE.Mesh(ck, ink); c.position.set(0, 0.05, 0.62); g.add(c);
  g.rotation.set(-0.12, -0.42, 0.06);
  return g;
}

function rubleShape() {
  const s = new THREE.Shape();
  // вертикальная ножка + чаша «Р» + перекладина
  s.moveTo(-0.55, -1.1); s.lineTo(-0.2, -1.1); s.lineTo(-0.2, -0.62); s.lineTo(0.35, -0.62); s.lineTo(0.35, -0.36); s.lineTo(-0.2, -0.36);
  s.lineTo(-0.2, -0.18); s.lineTo(0.2, -0.18);
  s.absarc(0.2, 0.42, 0.6, -Math.PI / 2, Math.PI / 2, false);
  s.lineTo(-0.55, 1.02); s.lineTo(-0.55, -0.18); s.lineTo(-0.8, -0.18); s.lineTo(-0.8, -0.36); s.lineTo(-0.55, -0.36); s.lineTo(-0.55, -0.62); s.lineTo(-0.8, -0.62); s.lineTo(-0.8, -0.82); s.lineTo(-0.55, -0.82);
  s.closePath();
  const hole = new THREE.Path(); hole.moveTo(-0.2, 0.12); hole.lineTo(0.2, 0.12); hole.absarc(0.2, 0.42, 0.3, -Math.PI / 2, Math.PI / 2, false); hole.lineTo(-0.2, 0.72); hole.closePath();
  s.holes.push(hole);
  return s;
}

function coin() {
  const g = new THREE.Group();
  const cyl = new THREE.CylinderGeometry(1.9, 1.9, 0.5, 128, 1);
  const rimG = new THREE.TorusGeometry(1.9, 0.25, 32, 128);
  const c = new THREE.Mesh(cyl, yellow); c.rotation.x = Math.PI / 2; g.add(c);
  const r1 = new THREE.Mesh(rimG, yellow); g.add(r1);
  const rg = center(ext(rubleShape(), 0.18, 0.06)); rg.scale(0.95, 0.95, 1);
  const r = new THREE.Mesh(rg, ink); r.position.z = 0.33; g.add(r);
  const r2 = r.clone(); r2.position.z = -0.33; r2.rotation.y = Math.PI; g.add(r2);
  g.rotation.set(0.15, -0.55, 0.12);
  return g;
}

function card() {
  const g = new THREE.Group();
  const pl = new THREE.Mesh(new RoundedBoxGeometry(3.8, 2.6, 0.22, 8, 0.2), glass); g.add(pl);
  const back = new THREE.Mesh(new RoundedBoxGeometry(3.4, 2.2, 0.12, 6, 0.16), yellow); back.position.set(0.5, 0.45, -0.6); back.rotation.z = 0.08; g.add(back);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.26, 48, 48), yellow); dot.position.set(-1.35, 0.75, 0.25); g.add(dot);
  const bars = [[-0.15, 0.78, 1.9], [-0.45, 0.25, 2.5], [-0.75, -0.25, 1.9], [-0.95, -0.75, 1.3]];
  bars.forEach(([x, y, w], i) => { const b = new THREE.Mesh(new RoundedBoxGeometry(w, 0.2, 0.08, 4, 0.08), i === 0 ? ink : white); b.position.set(x + w / 2 - 0.85, y, 0.16); g.add(b); });
  const ck = center(ext(checkShape(0.55), 0.1, 0.04)); const c = new THREE.Mesh(ck, ink); c.position.set(1.35, -0.75, 0.2);
  const pill = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.14, 64), yellow); pill.rotation.x = Math.PI / 2; pill.position.set(1.35, -0.75, 0.12);
  g.add(pill, c);
  g.rotation.set(-0.3, 0.45, 0.12);
  return g;
}

function pin() {
  // таймер: часы-кольцо с жёлтым сектором, символ срока
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.32, 48, 128), white); g.add(ring);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.3, 96), glass); face.rotation.x = Math.PI / 2; g.add(face);
  const sec = new THREE.Shape(); sec.moveTo(0, 0); sec.absarc(0, 0, 1.25, Math.PI / 2, Math.PI / 2 - 1.9, true); sec.lineTo(0, 0);
  const sg = ext(sec, 0.12, 0.03); sg.translate(0, 0, 0.02); g.add(new THREE.Mesh(sg, yellow));
  const hand = new THREE.Mesh(new RoundedBoxGeometry(0.16, 1.1, 0.12, 4, 0.06), ink); hand.position.set(0, 0.5, 0.25); g.add(hand);
  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.17, 32, 32), ink); hub.position.z = 0.25; g.add(hub);
  const btn = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.36, 0.36, 4, 0.12), yellow); btn.position.set(0, 1.95, 0); g.add(btn);
  g.rotation.set(-0.15, -0.5, -0.1);
  return g;
}

const make = { bubble, coin, card, pin }[obj];
const o = make();
scene.add(o);
// подогнать масштаб под кадр
const box = new THREE.Box3().setFromObject(o); const sz = new THREE.Vector3(); box.getSize(sz);
const k = 3.2 / Math.max(sz.x, sz.y); o.scale.setScalar(k);
const b2 = new THREE.Box3().setFromObject(o); const cc = new THREE.Vector3(); b2.getCenter(cc); o.position.sub(cc);

renderer.render(scene, cam);
window.__done = true;
</script>
</body></html>
